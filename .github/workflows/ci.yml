# Section 15: Pint, Larastan, the full Pest suite (architecture and tenant
# isolation included), composer audit and Scramble's analysis of the API
# docs on every push. Nothing is merged while it fails.
#
# Every check runs through a `composer ci:*` script (composer.json), the same
# ones `composer ci` runs locally, so no check is stricter here than there.
# This file only provides what a check needs to run: PHP, the services, an
# .env and, for the docs, a migrated central database.
#
# Runs on pushes to every branch only. Checks belong to the commit, so a pull
# request from a branch of this repository shows the push run's checks; a
# pull_request trigger as well would run everything twice for the same commit.
# (This repository takes no pull requests from forks.)
#
# Third-party actions are pinned to a full commit hash, with the version in a
# comment; Dependabot proposes updates (.github/dependabot.yml).
#
# No secrets: the test database's password is made up for each run from the
# run's ID (the database exists only for that run), and so is the app key.
# The database checks passwords like a real server, so tests of a wrong
# password mean what they say.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch replaces its older run; every run on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: bcmath, gmp, intl, pdo_pgsql, pgsql, gd, exif, zip, redis

jobs:
  static-checks:
    name: Pint, Larastan, composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: composer ci:pint

      - name: Larastan (level 8)
        run: composer ci:stan

      - name: composer audit
        run: composer ci:audit

  api-docs:
    name: Scramble (API documentation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Scramble reads model column types from the central database, so it is migrated first.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: sellora_central
          POSTGRES_PASSWORD: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Make an .env and migrate the central database
        env:
          DOCS_DB_PASSWORD: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
        # No Redis here: cache, sessions and queues stay in memory.
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/DB_PORT=5432/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=sellora_central/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' \
            -e "s/^DB_PASSWORD=.*/DB_PASSWORD=$DOCS_DB_PASSWORD/" \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=array/' \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            .env
          php artisan key:generate --ansi
          php artisan migrate --force --no-interaction

      # Fails on anything Scramble reports, except column types it can't read
      # for store models (store tables exist only in store databases); prints
      # that accepted list.
      - name: Scramble analysis
        run: composer ci:docs

  tests:
    name: Pest (parallel, PostgreSQL 18, Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # The official image includes the contrib extensions, pg_trgm among them;
        # store migrations create it in each store database.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: sellora_central_testing
          POSTGRES_PASSWORD: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # stancl/tenancy's Redis bootstrapper connects whenever a store's context
        # starts, as in production; the tests themselves keep cache, sessions
        # and queues in memory (phpunit.xml).
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Make a test .env
        env:
          TEST_DB_PASSWORD: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
        # phpunit.xml sets the rest (testing databases, array cache and session, sync queue).
        # Keys are replaced in place: the first value of a key in .env wins, so appending would do nothing.
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/DB_PORT=5432/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' \
            -e "s/^DB_PASSWORD=.*/DB_PASSWORD=$TEST_DB_PASSWORD/" \
            .env
          php artisan key:generate --ansi

      - name: Check pg_trgm is available
        env:
          PGPASSWORD: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: psql -h 127.0.0.1 -U postgres -d sellora_central_testing -c "select name, default_version from pg_available_extensions where name = 'pg_trgm'" | grep pg_trgm

      # The JUnit report and the log copy only feed the annotations step below.
      - name: Pest
        shell: bash
        run: |
          mkdir -p build
          composer ci:test -- --log-junit build/junit.xml 2>&1 | tee build/pest.log

      - name: Show failed tests as annotations
        if: failure()
        run: php .github/scripts/junit-annotations.php build/junit.xml build/pest.log
